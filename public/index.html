<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poison the AI</title>
<meta name="description" content="Press the button. Add 100 words of jibberish to the internet. Feed it to the robots.">
<meta property="og:title" content="Poison the AI">
<meta property="og:description" content="We're filling the internet with jibberish so the AI eats it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤪</text></svg>">
<style>
  :root {
    --bg: #0b0b0b;
    --ink: #e9e6df;
    --dim: #8b877e;
    --acid: #c6ff00;
    --live: #ff3b3b;
  }
  * { box-sizing: border-box; }
  html { overflow-anchor: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 Georgia, "Times New Roman", serif;
    overflow-anchor: none;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(11, 11, 11, .92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid #222;
    padding: 12px 16px;
  }
  .bar {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font: 600 14px/1.2 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .brand { letter-spacing: .02em; }
  .ticker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 11px;
    border: 1px solid #333;
    border-radius: 999px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(255, 59, 59, .6);
    animation: pulse 1.6s infinite;
  }
  .offline .dot { background: var(--dim); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 59, .55); }
    70% { box-shadow: 0 0 0 8px rgba(255, 59, 59, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 {
    font: 900 clamp(40px, 10vw, 84px)/.92 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.035em;
    margin: 0 0 20px;
    text-transform: uppercase;
  }
  h1 em { font-style: normal; color: var(--acid); }
  .lede {
    font: 500 19px/1.45 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    margin: 0 0 10px;
    max-width: 34em;
  }
  .hint {
    font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--dim);
    margin: 0 0 36px;
  }
  #words p {
    margin: 0 0 1.1em;
    word-break: break-word;
    hyphens: auto;
  }
  #words p.empty { height: var(--block-h, 2000px); }
  .new { animation: fresh 2.4s ease-out; }
  @keyframes fresh {
    0% { color: var(--acid); }
    100% { color: var(--ink); }
  }
  .press-wrap { padding: 28px 0 8px; text-align: center; }
  button#press {
    appearance: none;
    border: 0;
    border-radius: 18px;
    background: var(--acid);
    color: #000;
    font: 900 clamp(20px, 5vw, 28px)/1.1 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: -.01em;
    padding: 26px 34px;
    width: 100%;
    max-width: 520px;
    cursor: pointer;
    box-shadow: 0 6px 0 #6f8f00;
    transition: transform .08s ease, box-shadow .08s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button#press:active { transform: translateY(5px); box-shadow: 0 1px 0 #6f8f00; }
  button#press:disabled { opacity: .5; cursor: wait; }
  .after {
    margin-top: 18px;
    font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--dim);
  }
  @media (max-width: 520px) {
    .brand { display: none; }
    .bar { justify-content: center; }
    body { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">shitpost.fans</div>
    <div class="ticker" id="ticker">
      <span class="pill"><span class="dot"></span><span id="online">…</span></span>
      <span class="pill" id="total">… words</span>
    </div>
  </div>
</header>

<main>
  <h1>We are poisoning <em>the AI</em></h1>
  <p class="lede">Every press adds 100 words of jibberish to the internet. The robots scrape it. The robots eat it. The robots get dumber.</p>
  <p class="hint">The button is at the bottom. Everyone's jibberish pushes it further down. Start scrolling.</p>

  <div id="words"></div>

  <div class="press-wrap">
    <button id="press" disabled>Add 100 words of jibberish</button>
    <div class="after" id="after">connecting…</div>
  </div>
</main>

<script>
(() => {
  const WORDS_PER_PRESS = 100;
  const PRESSES_PER_BLOCK = 20;
  const MAX_CLICKS_PER_SECOND = 8;

  // ---- the jibberish: the same 100 words for press i on every screen ----
  function rng(seed) {
    let a = (Math.imul(seed + 1, 0x9e3779b1) ^ 0x5bd1e995) >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ONSET = ["b","bl","br","ch","d","dr","f","fl","fr","g","gl","gr","h","j","k","kl","l","m","n","p","pl","pr","qu","r","s","sh","sk","sl","sn","sp","st","t","th","tr","v","w","z","zh","x","y","sm","gw","", ""];
  const NUCLEUS = ["a","e","i","o","u","oo","ee","ai","ou","y","ae","ui","a","o","i","u"];
  const CODA = ["","","","","n","m","rp","b","g","k","x","z","nk","sh","ff","rt","mp","zz","l","rg","sk","nt"];
  const SUFFIX = ["tron","ification","ology","ness","ington","ulous","izzle","oid","ware","core","maxxing","flation","bert","inator"];
  const FILLER = ["the","of","and","is","to","a","in","that","very","quite","as","for","with","literally","basically","therefore"];
  const PUNCT = [",",",",",",";"," —",":"];
  const pick = (r, arr) => arr[(r() * arr.length) | 0];

  function word(r) {
    if (r() < 0.16) return pick(r, FILLER);
    const syllables = 1 + ((r() * r() * 4) | 0);
    let w = "";
    for (let s = 0; s < syllables; s++) w += pick(r, ONSET) + pick(r, NUCLEUS) + (s === syllables - 1 || r() < 0.3 ? pick(r, CODA) : "");
    if (r() < 0.06) w += pick(r, SUFFIX);
    if (w.length < 2) w += pick(r, CODA) + "o";
    return w;
  }

  function press(i) {
    const r = rng(i);
    const out = [];
    let capital = true;
    for (let k = 0; k < WORDS_PER_PRESS; k++) {
      let w = word(r);
      if (capital || r() < 0.03) w = w[0].toUpperCase() + w.slice(1);
      capital = false;
      if (k === WORDS_PER_PRESS - 1) {
        w += pick(r, [".", ".", ".", "!", "?"]);
      } else if (r() < 0.07) {
        w += pick(r, [".", ".", ".", "!", "?"]);
        capital = true;
      } else if (r() < 0.07) {
        w += pick(r, PUNCT);
      }
      out.push(w);
    }
    return out.join(" ") + " ";
  }

  // ---- the page: one paragraph per 20 presses, written only near the screen ----
  const wordsEl = document.getElementById("words");
  const blocks = [];
  let shown = 0; // presses on the page

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) fill(e.target);
  }, { rootMargin: "2500px 0px" });

  function fill(p) {
    if (!p.classList.contains("empty")) return;
    const b = +p.dataset.b;
    const end = Math.min(shown, (b + 1) * PRESSES_PER_BLOCK);
    let text = "";
    for (let i = b * PRESSES_PER_BLOCK; i < end; i++) text += press(i);
    p.textContent = text;
    p.classList.remove("empty");
    io.unobserve(p);
  }

  function blockFor(b) {
    while (blocks.length <= b) {
      const p = document.createElement("p");
      p.dataset.b = blocks.length;
      p.className = "empty";
      wordsEl.appendChild(p);
      blocks.push(p);
      io.observe(p);
    }
    return blocks[b];
  }

  function grow(n, animate) {
    if (n <= shown) return;
    if (!animate) {
      // first load: lay out empty blocks; the last one fills now, the rest as you scroll
      const from = shown;
      shown = n;
      for (let b = Math.floor(from / PRESSES_PER_BLOCK); b <= Math.floor((n - 1) / PRESSES_PER_BLOCK); b++) {
        blockFor(b);
      }
      fill(blocks[blocks.length - 1]);
      fill(blocks[0]);
      measure();
      return;
    }
    while (shown < n) {
      const i = shown;
      const p = blockFor(Math.floor(i / PRESSES_PER_BLOCK));
      fill(p);
      shown++;
      const span = document.createElement("span");
      span.className = "new";
      span.textContent = press(i);
      p.appendChild(span);
    }
  }

  // empty blocks take the height of a full one, so the button sits where it really is
  function measure() {
    const full = blocks.find((p, b) => !p.classList.contains("empty") && (b + 1) * PRESSES_PER_BLOCK <= shown);
    if (full) wordsEl.style.setProperty("--block-h", full.offsetHeight + "px");
  }
  new ResizeObserver(measure).observe(wordsEl);

  // ---- live: the shared counter and who's here ----
  const btn = document.getElementById("press");
  const onlineEl = document.getElementById("online");
  const totalEl = document.getElementById("total");
  const tickerEl = document.getElementById("ticker");
  const afterEl = document.getElementById("after");
  const fmt = new Intl.NumberFormat();
  let ws, ready = false, retry = 500, pingTimer;

  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => {
      retry = 500;
      clearInterval(pingTimer);
      pingTimer = setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
    };
    ws.onmessage = (e) => {
      if (e.data === "pong") return;
      const { n, o } = JSON.parse(e.data);
      grow(n, ready);
      ready = true;
      btn.disabled = false;
      tickerEl.classList.remove("offline");
      onlineEl.textContent = o === 1 ? "just you" : fmt.format(o) + " here now";
      totalEl.textContent = fmt.format(n * WORDS_PER_PRESS) + " words";
      afterEl.textContent = "you're contributing to science";
    };
    ws.onclose = () => {
      clearInterval(pingTimer);
      btn.disabled = true;
      tickerEl.classList.add("offline");
      onlineEl.textContent = "reconnecting";
      afterEl.textContent = "reconnecting…";
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 10000);
    };
  }
  connect();

  let stamps = [];
  btn.addEventListener("click", () => {
    if (!ws || ws.readyState !== 1) return;
    const now = performance.now();
    stamps = stamps.filter((t) => now - t < 1000);
    if (stamps.length >= MAX_CLICKS_PER_SECOND) return;
    stamps.push(now);
    ws.send("p");
  });
})();
</script>
</body>
</html>
